<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Navbar</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400..900&family=Jost:ital,wght@0,100..900;1,100..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&family=Rubik+Distressed&family=Sedgwick+Ave+Display&family=Smooch+Sans:wght@100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="navbar.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Hidden checkbox used to toggle the mobile drawer -->
    <input type="checkbox" id="menu-toggle" />
    <nav class="navbar">
      <a class="logo" href="#"><i class="ri-apple-fill"></i></a>
      <div class="menu">
        <ul>
          <li><a href="#">Store</a></li>
          <li><a href="#">Mac</a></li>
          <li><a href="#">iPad</a></li>
          <li><a href="#">iPhone</a></li>
          <li><a href="#">Watch</a></li>
          <li><a href="#">AirPods</a></li>
          <li><a href="#">TV&Home</a></li>
          <li><a href="#">Entertainment</a></li>
          <li><a href="#">Accessories</a></li>
          <li><a href="#">Support</a></li>
        </ul>
      </div>
      <div class="actions">
        <div class="search-container">
          <input type="search" name="text" placeholder="Search/Enter" />
          <button><i class="ri-search-line"></i></button>
        </div>
        <div class="hc-container">
          <a href="#"><i class="ri-shopping-bag-2-fill"></i></a>
          <label class="hamburger" for="menu-toggle">
            <i class="ri-menu-5-line"></i>
          </label>
        </div>
      </div>
    </nav>
    <!-- Mobile Navigation Drawer -->
    <section class="mobile-menu">
      <ul>
        <li><a href="#">Store</a></li>
        <li><a href="#">Mac</a></li>
        <li><a href="#">iPad</a></li>
        <li><a href="#">iPhone</a></li>
        <li><a href="#">Watch</a></li>
        <li><a href="#">AirPods</a></li>
        <li><a href="#">TV&Home</a></li>
        <li><a href="#">Entertainment</a></li>
        <li><a href="#">Accessories</a></li>
        <li><a href="#">Support</a></li>
      </ul>
    </section>
    <label for="menu-toggle" class="overlay"></label>
  </body>
</html>
