      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>

    <section class="container">
      <div class="ui-container-left">
        <div class="flowsync-logo">
          <img src="assets/images/flowsync.png" alt="flowsync-logo" />
        </div>

        <h1>Welcome <span>back!</span></h1>
        <p>Log in to continue managing your workflow seamlessly.</p>

        <div class="visual">
          <img src="assets/images/dashboard.png" alt="dashboard img" />
        </div>
      </div>

      <div class="ui-container-right">
        <h2>Login to your <span>account</span></h2>
        <p>Enter your credentials to access your account</p>
        <form action="#">
          <div class="input-field">
            <div class="input-box">
              <i id="mail" class="ri-mail-send-line"></i>
              <input
                type="email"
                name="email"
                autocomplete="email"
                placeholder="Email address"
              />
            </div>

            <div class="input-box">
              <i id="lock" class="ri-lock-password-line"></i>
              <input
                type="password"
                name="password"
                autocomplete="current-password"
                placeholder="Password"
              />
              <i id="eye-icon" class="ri-eye-off-line"></i>
              <!-- 👁 right side -->
            </div>

            <div class="form-options">
              <label>
                <input type="checkbox" />
                Remember me
              </label>
              <a class="fg-pass" href="#">Forgot password?</a>
            </div>
            <div class="login-btn"><button type="submit">Login</button></div>
          </div>

          <div class="divider">
            <span>or continue with</span>
          </div>

          <div class="optional-btn">
            <a href="#" class="google"
              ><img src="assets/images/google.svg" alt="google" />Google</a
            >
            <a href="#" class="github"
              ><img src="assets/images/github.svg" alt="github" /> GitHub</a
            >
          </div>
          <div class="signup">
            <span>Don't have an account?</span>
            <a href="#">Sign up?</a>
          </div>
        </form>
      </div>
    </section>
  </body>
</html>
