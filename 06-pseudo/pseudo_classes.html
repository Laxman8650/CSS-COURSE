<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pseudo Classes</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      .container {
        height: 100vh;
        background-color: #efe30043;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      /* Direct Element Selector */
      p {
        font-size: 30px;
        text-align: center;
        text-decoration: dashed black underline;
      }
      .main {
        width: 70%;
        margin: auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        justify-content: center;
        align-items: center;
      }

      .names {
        display: grid;
        grid-template-columns: 1fr;
        /* place-items: start; */
        gap: 15px;
      }
      /* Class or Element Selector */
      /* .main p {
        color: red;
      } */

      /* First child and nth child are order wise changing techniques */
      /* p:first-child {
        color: red;
      } */

      .names :nth-child(2),
      .names :nth-child(4) {
        color: red;
        text-align: center;
        text-decoration: none;
      }
      .names :nth-child(1),
      .names :nth-child(3) {
        color: blue;
        text-align: center;
        text-decoration: none;
      }
      .main1 {
        height: 200px;
        width: 200px;
        color: rgb(250, 249, 249);
        background: rgb(255, 0, 221);
        border-radius: 4px;
        box-shadow: 5px 2px 5px rgba(0, 0, 0, 0.5);
        transition: all 0.3s ease;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        margin: auto;
      }
      /* It's Hover Effect */
      .main1:hover {
        background: black;
        color: white;
        transition: 1s;
      }

      /* This is Focus effect (Note: Click on red Box) */
      .main1:focus {
        background-color: green;
        outline: 2px dotted #ffffff;
        outline-offset: -4px;
        cursor: pointer;
      }

      /* This is active effect (Note: Hold Mouse On box) */
      .main1:active {
        background-color: orange;
        transform: scale(0.95);
        box-shadow: 5px 7px 6px rgba(0, 0, 0, 0.5);
      }
      h3 {
        margin-top: 20px;

        font-family: cursive;
        text-align: center;
        word-spacing: 3px;
      }
      h4 {
        font-family: cursive;
        margin-top: 50px;
        text-align: center;
        word-spacing: 3px;
      }
      .main1 b {
        font-variant: small-caps;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h3>
        &bull;Defination: Pseudo Class use for change the specific state of
        element(Such as: hover, active).
      </h3>
      <h4>Syntax:.class:hover{properties:value;}, use of samicolon(:).</h4>
      <div class="main">
        <div class="names">
          <p>Mohit</p>
          <p>Rahul</p>
          <p>Summit</p>
          <p>Karan</p>
        </div>

        <div class="main1" tabindex="0">
          <p>Hover this box</p>
          <b>My name is Laxman</b>
        </div>
      </div>
    </div>
  </body>
</html>
